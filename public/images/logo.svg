<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#0d0a1a"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- fond arrondi -->
  <rect x="4" y="4" width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- petit accent "manette" stylisé au-dessus du monogramme -->
  <g stroke="url(#neonGrad)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9">
    <line x1="70" y1="52" x2="82" y2="52"/>
    <line x1="76" y1="46" x2="76" y2="58"/>
    <circle cx="120" cy="46" r="4" fill="#ec4899" stroke="none"/>
    <circle cx="132" cy="58" r="4" fill="#22d3ee" stroke="none"/>
  </g>

  <!-- monogramme GS -->
  <text x="100" y="140" text-anchor="middle"
        font-family="'Poppins', Arial, sans-serif" font-weight="700"
        font-size="86" fill="url(#neonGrad)">GS</text>
</svg>
